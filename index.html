<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioRblx Web</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{--bg:#1e1f22;--pn:#2b2d31;--bd:#3a3c42;--tx:#e3e5e8;--ac:#00a2ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif}
#app{display:grid;height:100%;grid-template:auto 1fr 130px/220px 1fr 260px}
#bar{grid-column:1/4;display:flex;gap:6px;padding:6px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}
button{background:#3a3c42;color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:5px 10px;cursor:pointer}button:hover{background:var(--ac)}
.b{font-weight:700;color:var(--ac);margin-right:8px}
#exp,#prop{background:var(--pn);overflow:auto;padding:4px}
#exp{border-right:1px solid var(--bd)}#prop{border-left:1px solid var(--bd)}
#vp{position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}
#out{grid-column:1/4;background:#111;border-top:1px solid var(--bd);overflow:auto;padding:4px 8px;font:12px monospace;white-space:pre-wrap}
.n{padding:2px 4px;cursor:pointer;white-space:nowrap;border-radius:3px}.n:hover{background:#3a3c42}.n.s{background:var(--ac);color:#fff}
h4{margin:6px 4px;color:#9aa}.r{display:flex;gap:4px;margin:3px 4px;align-items:center}.r label{width:80px;color:#9aa}.r input{flex:1;min-width:0;background:#1e1f22;color:var(--tx);border:1px solid var(--bd);padding:3px;border-radius:3px}
@media(max-width:800px){#app{grid-template:auto 1fr 120px 120px/1fr}#bar,#out{grid-column:1}#exp,#prop{max-height:120px}}
</style></head><body>
<div id="app">
<div id="bar"><span class="b">StudioRblx Web</span>
<button id="open">Open .rbxlx</button><button id="save">Save .rbxlx</button>
<button id="add">+ Part</button><button id="sph">+ Ball</button><button id="dup">Duplicate</button><button id="del">Delete</button>
<button id="reset">New place</button><input id="file" type="file" accept=".rbxlx,.xml" hidden></div>
<div id="exp"></div><div id="vp"></div><div id="prop"></div><div id="out"></div></div>
<script type="module" src="./app.js"></script></body></html>
